name: Update Market Data

on:
  schedule:
    - cron: '0,30 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install yfinance --break-system-packages -q

      - name: Fetch market data
        run: |
          python3 << 'EOF'
          import json, datetime
          import yfinance as yf

          SYMBOLS = {
            "us": [
              ("^GSPC",  "S&P 500",          "SPX"),
              ("^IXIC",  "나스닥 종합",         "COMP"),
              ("^DJI",   "다우존스",            "DJI"),
              ("^VIX",   "VIX 공포지수",        "VIX"),
              ("^SOX",   "필라델피아 반도체",    "SOX"),
            ],
            "kr": [
              ("^KS11",  "코스피",      "KOSPI"),
              ("^KQ11",  "코스닥",      "KOSDAQ"),
              ("^KQ150", "코스닥 150",  "KOSDAQ150"),
              ("EWY",    "Korea ETF",   "EWY"),
            ],
            "asia": [
              ("^N225",     "니케이 225",  "NKY"),
              ("^HSI",      "항셍",        "HSI"),
              ("000001.SS", "상하이 종합", "SHCOMP"),
              ("^TWII",     "대만 가권",   "TAIEX"),
              ("^NSEI",     "니프티 50",   "NIFTY"),
              ("^BSESN",    "센섹스",      "SENSEX"),
            ],
            "europe": [
              ("^STOXX50E", "유로스탁스 50", "SX5E"),
              ("^FTSE",     "FTSE 100",      "UKX"),
              ("^GDAXI",    "DAX",           "DAX"),
              ("^FCHI",     "CAC 40",        "CAC"),
            ],
            "crypto": [
              ("BTC-USD",  "비트코인",   "BTC/USD"),
              ("ETH-USD",  "이더리움",   "ETH/USD"),
            ],
          }

          COMMODITIES = [
            ("GC=F",  "금 (Gold)",      "XAU/USD", "USD/oz"),
            ("SI=F",  "은 (Silver)",    "XAG/USD", "USD/oz"),
            ("CL=F",  "WTI 원유",       "Crude",   "USD/bbl"),
            ("BZ=F",  "브렌트유",       "Brent",   "USD/bbl"),
            ("MCO=F", "두바이유",       "Dubai",   "USD/bbl"),
            ("HG=F",  "구리 (Copper)",  "COMEX",   "USD/lb"),
            ("NI=F",  "니켈 (Nickel)",  "LME",     "USD/t"),
          ]

          RATES = [
            ("^IRX",  "미국 단기 (13W)", "T-Bill"),
            ("^FVX",  "미국 5년물",      "US5Y"),
            ("^TNX",  "미국 10년물",     "US10Y"),
            ("^TYX",  "미국 30년물",     "US30Y"),
          ]

          def fetch(sym):
            try:
              t = yf.Ticker(sym)
              hist = t.history(period="5d")
              if hist.empty:
                print(f"  [WARN] {sym}: empty history")
                return None
              # 최신 종가 기준
              price = float(hist['Close'].iloc[-1])
              prev  = float(hist['Close'].iloc[-2]) if len(hist) > 1 else price
              chg   = round(price - prev, 4)
              pct   = round(chg / prev * 100 if prev else 0, 4)
              print(f"  OK {sym}: {price:.3f}  ({pct:+.2f}%)")
              return {"price": round(price, 4), "change": chg, "pct": pct}
            except Exception as e:
              print(f"  [ERR] {sym}: {e}")
              return None

          result = {
            "updated": datetime.datetime.utcnow().isoformat() + "Z",
            "indices": {}, "commodities": [], "rates": []
          }

          for region, items in SYMBOLS.items():
            result["indices"][region] = []
            for sym, name, sub in items:
              print(f"Fetching {sym} ({name})...")
              q = fetch(sym)
              result["indices"][region].append(
                {"sym": sym, "name": name, "sub": sub, "q": q}
              )

          for sym, name, sub, unit in COMMODITIES:
            print(f"Fetching {sym} ({name})...")
            q = fetch(sym)
            result["commodities"].append(
              {"sym": sym, "name": name, "sub": sub, "unit": unit, "q": q}
            )

          for sym, name, sub in RATES:
            print(f"Fetching {sym} ({name})...")
            q = fetch(sym)
            result["rates"].append(
              {"sym": sym, "name": name, "sub": sub, "q": q}
            )

          with open("market.json", "w", encoding="utf-8") as f:
            json.dump(result, f, ensure_ascii=False, indent=2)

          print(f"\n=== 완료 ===")
          print(f"S&P 500  : {result['indices']['us'][0]['q']}")
          print(f"NIFTY    : {result['indices']['asia'][4]['q']}")
          print(f"Copper   : {result['commodities'][5]['q']}")
          EOF

      - name: Fetch CNN Fear & Greed
        run: |
          curl -s \
            -H "Accept: application/json" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            -H "Referer: https://www.cnn.com/markets/fear-and-greed" \
            -L \
            "https://production.dataviz.cnn.io/index/fearandgreed/graphdata" \
            -o fg.json
          python3 -c "
          import json,sys
          try:
            d=json.load(open('fg.json'))
            print('F&G:', d['fear_and_greed']['score'])
          except Exception as e:
            print('F&G ERROR:', e); sys.exit(1)
          "

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add market.json fg.json
          git diff --cached --quiet || git commit -m "chore: update market data $(date -u +%H:%M)"
          git push
