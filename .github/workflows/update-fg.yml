name: Update Fear & Greed Data

on:
  schedule:
    - cron: '0,30 * * * *'
  workflow_dispatch:

jobs:
  update-fg:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch CNN Fear & Greed data
        run: |
          curl -s \
            -H "Accept: application/json" \
            -H "User-Agent: Mozilla/5.0 (compatible; dashboard/1.0)" \
            "https://production.dataviz.cnn.io/index/fearandgreed/graphdata" \
            -o fg.json

          if ! python3 -c "import json,sys; json.load(open('fg.json'))" 2>/dev/null; then
            echo "Invalid JSON received, aborting."
            exit 1
          fi

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fg.json
          git diff --cached --quiet || git commit -m "chore: update fear & greed data"
          git push
